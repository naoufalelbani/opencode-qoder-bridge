name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" != "$tag_version"
          test "$tag_version" = "$package_version"
          echo "Publishing package version $package_version from $RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Run stress tests
        run: npm run test:stress

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing and provenance
        run: npm publish --access public --provenance

      - name: Verify package is visible on npm
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          # npm explicitly warns the package "may take a few minutes to
          # become available" after a successful publish; 12x10s was proven
          # too short (v0.2.0 published fine but was invisible at 2 minutes).
          for attempt in $(seq 1 20); do
            if test "$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)" = "$package_version"; then
              echo "Verified ${package_name}@${package_version} on npm"
              exit 0
            fi
            echo "Waiting for npm registry propagation (attempt $attempt/20)"
            sleep 15
          done
          echo "Published package was not visible on npm after waiting" >&2
          exit 1
