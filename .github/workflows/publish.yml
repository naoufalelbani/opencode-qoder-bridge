name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" != "$tag_version"
          test "$tag_version" = "$package_version"
          echo "Publishing package version $package_version from $RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Run stress tests
        run: npm run test:stress

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing and provenance
        run: npm publish --access public --provenance
