<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Qoder Bridge architecture</title>
  <desc id="desc">OpenCode sends prompts and tool calls through the bridge to the official Qoder Agent SDK and receives streamed responses, quota data, and usage metadata.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#263b69"/></linearGradient>
    <marker id="arrow" markerHeight="8" markerWidth="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#93c5fd"/></marker>
    <style>.label{font:600 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f8fafc}.detail{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#bfdbfe}.small{font:13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#cbd5e1}</style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="54" y="54" class="label">OpenCode Qoder Bridge</text>
  <text x="54" y="80" class="small">Streaming, tools, sessions, quota, and usage flow</text>
  <g transform="translate(55 125)"><rect width="220" height="135" rx="16" fill="url(#node)" stroke="#60a5fa"/><text x="24" y="42" class="label">OpenCode</text><text x="24" y="70" class="detail">prompts · tools · TUI</text><text x="24" y="96" class="small">AI SDK v3 host</text></g>
  <g transform="translate(490 125)"><rect width="220" height="135" rx="16" fill="url(#node)" stroke="#a78bfa"/><text x="24" y="42" class="label">Bridge</text><text x="24" y="70" class="detail">stream + tool adapter</text><text x="24" y="96" class="small">sessions · quota · ledger</text></g>
  <g transform="translate(925 125)"><rect width="220" height="135" rx="16" fill="url(#node)" stroke="#34d399"/><text x="24" y="42" class="label">Qoder SDK</text><text x="24" y="70" class="detail">models · MCP · runtime</text><text x="24" y="96" class="small">official agent transport</text></g>
  <path d="M275 174H480" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 174H915" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/><path d="M915 216H720" stroke="#86efac" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 216H275" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="334" y="160" class="small">request + host tools</text><text x="775" y="160" class="small">SDK query</text><text x="766" y="242" class="small">stream + result</text><text x="327" y="242" class="small">OpenCode parts</text>
  <text x="54" y="315" class="small">Quota failures are surfaced as quota_exceeded with an actionable upgrade link.</text>
</svg>
