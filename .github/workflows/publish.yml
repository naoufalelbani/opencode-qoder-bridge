name: Release checks

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          package-manager-cache: false

      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
